name: ai_skincare_platform
description: AI-powered skincare analysis platform mobile application.

# Prevent accidental publishing to pub.dev
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.0.5

  # HTTP Client
  dio: ^5.3.3

  # Routing
  go_router: ^14.2.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  # Security & encryption
  encrypt: ^5.0.3

  # Device capabilities / storage
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.3

  # UI/Styling
  google_fonts: ^6.1.0

  # Notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  sentry_flutter: ^8.3.0

  # Localization & utilities
  intl: ^0.20.2
  share_plus: ^7.2.1
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_full.png
    - assets/images/logo_mark.png
    - assets/images/hero_wave.png
    - assets/images/onboarding_1.png
    - assets/images/product_placeholder.png
    - assets/images/analysis_placeholder.png

